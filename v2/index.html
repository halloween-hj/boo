<!DOCTYPE html>
<html lang="ko"><!-- v3 --><head><script>try{if(sessionStorage.getItem('hj_ok')!=='1')location.replace('../index.html')}catch(e){location.replace('../index.html')}</script><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Halloween Birthday Bar 🎃 (v2)</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body><div id="app">

<section class="scene on" id="s1">
<h1 style="color:#aee6ff;text-shadow:0 0 8px #2f74ff;font-size:14px;line-height:1.8">HAPPY BIRTHDAY<br><span id="n1"></span>’S HALLOWEEN</h1>
<div id="introw" style="position:relative;width:100%;max-width:440px">
<canvas id="introc" width="128" height="96" style="width:100%;display:block;image-rendering:pixelated"></canvas>
<div id="moon" onclick="moonTap()" style="position:absolute;left:44%;top:4%;font-size:26px;cursor:pointer">🌕</div>
<div onclick="toast('🎃 Trick or Treat?')" style="position:absolute;left:87%;top:67%;width:11%;height:13%;cursor:pointer"></div>
</div>
<p>10월 31일, 오늘은 특별한 날 🦇</p>
<button class="btn" onclick="go('s2')">GAME START</button>
</section>

<section class="scene" id="s2">
<div id="stage"><span style="position:absolute;left:6px;top:4px;font-size:22px">🕸️</span><span style="position:absolute;right:8px;top:2px;font-size:24px">🎃</span><canvas id="bk" width="120" height="54"></canvas><div id="ctop"></div><div id="stream"></div><canvas id="pv" width="32" height="40"></canvas><canvas id="lid" width="40" height="8"></canvas></div>
<p id="cname" style="font-size:14px;padding:4px 10px;line-height:1.3;min-height:36px;display:flex;align-items:center;justify-content:center"></p>
<div id="tbl"></div>
<div class="row" style="padding:8px"><button class="btn" style="font-size:17px" onclick="clearG()">비우기 🗑</button><button class="btn" style="font-size:17px" onclick="finish()">완성! 🍹</button></div>
</section>

<section class="scene" id="s3">
<p id="hud">점수 0/12 · 🎃🍒🍬 받고 🕷️ 피하기</p>
<canvas id="gc" style="width:100%;max-width:320px;touch-action:none;border:4px solid var(--pu)"></canvas>
<p style="font-size:15px">손가락으로 잔을 좌우로 움직여요</p>
</section>

<section class="scene" id="s4">
<h1>PICK A GIFT</h1>
<p>상자 하나를 골라봐요 🎁</p>
<div class="gifts" id="gifts"></div>
<div class="box hide" id="gmsg"></div>
<button class="btn hide" id="gnext" onclick="go('s6')">다음 💌</button>
</section>

<section class="scene" id="s5">
<h1>MAKE A WISH</h1>
<canvas id="cake" width="32" height="34" style="width:256px;height:272px"></canvas>
<p id="ctxt">초를 눌러서 불을 붙여요 (0/3)</p>
<button class="btn hide" id="blow" onclick="blowOut()">후~ 불기 💨</button>
</section>

<section class="scene" id="s6">
<h1>HAPPY BIRTHDAY!</h1>
<div class="box"><div id="letter"></div></div>
<button class="btn hide" id="nxt" onclick="go('s9')">다음 🩷</button>
<button id="alarm" class="hide" onclick="showReward()" aria-label="alarm"><canvas id="bell" width="16" height="16"></canvas></button>
</section>

<section class='scene' id='s7'><h1>SHAKE IT!</h1><p id='rtxt' style='font-size:16px'>떨어지는 재료를 박자에 맞춰 탭!</p><canvas id='rc' width='300' height='360' style='width:100%;max-width:300px;border:4px solid var(--pu);touch-action:none;image-rendering:pixelated'></canvas><div class='box' style='padding:3px;max-width:300px'><div id='bar' style='height:14px;width:0;background:var(--or)'></div></div></section>
<section class='scene' id='s8'><h1>TA-DA!</h1><img id='big' style='width:256px;height:256px;image-rendering:pixelated'><div class='row' id='rt'></div><p id='rn'></p><p id='ri' style='font-size:15px'></p><button class='btn' onclick='go("s4")'>선물 받으러 🎁</button></section>
<section class="scene" id="s9" style="padding:0"><canvas id="fw" width="120" height="214" style="position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated"></canvas><div id="fwb" class="hide" style="position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px"><button class="btn" onclick="location.reload()">다시 시작</button></div></section>
<button id="mute" onclick="bgmToggle()" aria-label="sound">🔊</button><div id="gc"></div><div id="rw" class="hide"><div class="rwb"><h1>SECRET REWARD!</h1><p>👻 유령을 3마리 이상 잡아서<br>시크릿 보상 획득!</p><div class="tk"><canvas id="tkc" width="64" height="32"></canvas><div class="tkt"><b>소원권</b><span>1일 연장권</span></div></div><button class="btn" onclick="closeReward()">닫기</button></div></div><canvas id="blood" width="60" height="34"></canvas><div id="toast"></div>
</div>
<a href="../index.html" style="position:fixed;right:8px;top:8px;z-index:60;font:14px Jua,sans-serif;color:#fff;background:#0008;border:2px solid #ffffff55;border-radius:8px;padding:6px 10px;text-decoration:none;opacity:.75">← 버전 선택</a>
<script src="config.js"></script>
<script src="script.js"></script></body></html>
